<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved - Axsuz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="container">
    <div class="section-title"><h2>🔖 𝐒𝐀𝐕𝐄𝐃 𝐏𝐈𝐍𝐒</h2></div>
    <div class="grid" id="savedGrid"></div>
</main>
<div id="footer"></div>
<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐀𝐱𝐬𝐮𝐳 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = AxsuzStorage.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    const savedIds = AxsuzStorage.getSaved();
    const savedPins = AxsuzStorage.getPins().filter(p => savedIds.includes(p.id));
    renderPins('savedGrid', savedPins);
});
</script>
</body>
</html>
