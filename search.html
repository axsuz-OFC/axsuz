<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - Axsuz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="container">
    <div class="section-title"><h2>🔍 𝐒𝐄𝐀𝐑𝐂𝐇</h2></div>
    <div class="search-bar" style="position:relative;margin-bottom:25px;">
        <input type="text" id="searchInput" placeholder="Search photos..." oninput="handleSearch()" style="width:100%;padding:14px 45px 14px 20px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,85,0.5);border-radius:25px;color:#fff;font-size:14px;">
    </div>
    <p id="resultCount" style="color:#ff0055;font-size:12px;margin-bottom:15px;display:none;"></p>
    <div class="grid" id="searchResults"></div>
</main>
<div id="footer"></div>
<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐀𝐱𝐬𝐮𝐳 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    renderPins('searchResults', AxsuzStorage.getPins());
});
function handleSearch() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const all = AxsuzStorage.getPins();
    const count = document.getElementById('resultCount');
    if (!q) { renderPins('searchResults', all); count.style.display = 'none'; return; }
    const filtered = all.filter(p => p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.username.toLowerCase().includes(q));
    if (filtered.length > 0) { count.textContent = 'Results: ' + filtered.length; count.style.display = 'block'; }
    else count.style.display = 'none';
    renderPins('searchResults', filtered);
}
</script>
</body>
</html>
