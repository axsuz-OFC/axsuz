<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Axsuz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="container">
    <div class="form-box">
        <h2>𝐋𝐨𝐠𝐢𝐧</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="handleLogin()">𝐋𝐨𝐠𝐢𝐧</button>
        <div class="form-link">New here? <a href="register.html">Sign Up</a></div>
    </div>
</main>
<div id="footer"></div>
<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐀𝐱𝐬𝐮𝐳 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
function handleLogin() {
    const e = document.getElementById('loginEmail').value.trim();
    const p = document.getElementById('loginPassword').value;
    const r = AxsuzStorage.login(e, p);
    if (r.success) window.location.href = 'home.html';
    else alert('❌ ' + r.message);
}
</script>
</body>
</html>
