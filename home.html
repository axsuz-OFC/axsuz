<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Axsuz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<main class="container">
    <div style="position:relative;margin-bottom:15px;">
        <input type="text" id="onlineSearch" placeholder="🔍 Search photos..." 
            style="width:100%;padding:14px 20px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,85,0.5);border-radius:25px;color:#fff;font-size:14px;font-family:'Courier New',monospace;"
            onkeypress="if(event.key==='Enter') doSearch()">
    </div>
    
    <div class="mode-toggle">
        <button onclick="switchMode('online')" class="mode-btn active" id="mode-online">🌐 𝐎𝐧𝐥𝐢𝐧𝐞</button>
        <button onclick="switchMode('offline')" class="mode-btn" id="mode-offline">📱 𝐎𝐟𝐟𝐥𝐢𝐧𝐞</button>
    </div>
    
    <div class="categories" id="onlineCategories">
        <button onclick="loadCategory('trending')" class="category-chip active" id="cat-trending">🔥 Trending</button>
        <button onclick="loadCategory('nature')" class="category-chip" id="cat-nature">🌿 Nature</button>
        <button onclick="loadCategory('cars')" class="category-chip" id="cat-cars">🚗 Cars</button>
        <button onclick="loadCategory('anime')" class="category-chip" id="cat-anime">🎌 Anime</button>
        <button onclick="loadCategory('city')" class="category-chip" id="cat-city">🏙️ City</button>
        <button onclick="loadCategory('space')" class="category-chip" id="cat-space">🚀 Space</button>
        <button onclick="loadCategory('wallpaper')" class="category-chip" id="cat-wallpaper">📱 Wallpaper</button>
        <button onclick="loadCategory('art')" class="category-chip" id="cat-art">🎨 Art</button>
        <button onclick="loadCategory('food')" class="category-chip" id="cat-food">🍔 Food</button>
        <button onclick="loadCategory('travel')" class="category-chip" id="cat-travel">✈️ Travel</button>
    </div>
    
    <div class="section-title"><h2 id="sectionTitle">📸 𝐄𝐗𝐏𝐋𝐎𝐑𝐄</h2></div>
    
    <div class="grid" id="photosGrid"></div>
    
    <div id="loadMoreTrigger" style="height:50px;"></div>
</main>

<div id="footer"></div>

<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐀𝐱𝐬𝐮𝐳 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/pexels.js"></script>
<script>
let currentMode = 'online';
let currentCategory = 'trending';
let currentPage = 1;
let isLoading = false;
let allPhotos = [];

document.addEventListener('DOMContentLoaded', () => {
    switchMode('online');
    setupInfiniteScroll();
});

// ===== SKELETON LOADING =====
function showSkeleton(count = 8) {
    const grid = document.getElementById('photosGrid');
    let html = '';
    for (let i = 0; i < count; i++) {
        html += `<div class="skeleton"></div>`;
    }
    grid.innerHTML = html;
}

// ===== MODE SWITCH =====
function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + mode).classList.add('active');
    
    const grid = document.getElementById('photosGrid');
    const categories = document.getElementById('onlineCategories');
    const sectionTitle = document.getElementById('sectionTitle');
    const searchBar = document.getElementById('onlineSearch');
    
    grid.innerHTML = '';
    
    if (mode === 'online') {
        categories.style.display = 'flex';
        searchBar.style.display = 'block';
        sectionTitle.textContent = '📸 𝐄𝐗𝐏𝐋𝐎𝐑𝐄';
        showSkeleton(8);
        loadCategory('trending');
    } else {
        categories.style.display = 'none';
        searchBar.style.display = 'none';
        sectionTitle.textContent = '📱 𝐎𝐅𝐅𝐋𝐈𝐍𝐄 𝐏𝐈𝐍𝐒';
        showSkeleton(6);
        loadOfflinePins();
    }
}

// ===== ONLINE (Pexels) =====
async function loadCategory(cat) {
    if (currentMode !== 'online') return;
    currentCategory = cat;
    currentPage = 1;
    allPhotos = [];
    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
    document.getElementById('cat-' + cat)?.classList.add('active');
    
    showSkeleton(8);
    
    let photos = cat === 'trending' ? await PexelsAPI.getTrending(1) : await PexelsAPI.search(cat, 1);
    
    if (!photos || photos.length === 0) {
        document.getElementById('photosGrid').innerHTML = `
            <div class="empty-state">
                <div class="icon">❌</div>
                <p>No photos found<br>Check internet connection</p>
            </div>
        `;
        return;
    }
    
    allPhotos = photos;
    renderOnlinePhotos(photos, false);
}

async function doSearch() {
    if (currentMode !== 'online') return;
    const q = document.getElementById('onlineSearch').value.trim();
    if (!q) return;
    currentCategory = 'search_' + q;
    currentPage = 1;
    allPhotos = [];
    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
    
    showSkeleton(8);
    
    const photos = await PexelsAPI.search(q, 1);
    if (!photos || photos.length === 0) {
        document.getElementById('photosGrid').innerHTML = `
            <div class="empty-state">
                <div class="icon">🔍</div>
                <p>No results for "${q}"</p>
            </div>
        `;
        return;
    }
    
    allPhotos = photos;
    renderOnlinePhotos(photos, false);
}

async function loadMore() {
    if (isLoading || currentMode !== 'online') return;
    isLoading = true;
    currentPage++;
    let photos;
    if (currentCategory.startsWith('search_')) photos = await PexelsAPI.search(currentCategory.replace('search_', ''), currentPage);
    else if (currentCategory === 'trending') photos = await PexelsAPI.getTrending(currentPage);
    else photos = await PexelsAPI.search(currentCategory, currentPage);
    
    if (photos && photos.length > 0) { allPhotos = allPhotos.concat(photos); renderOnlinePhotos(photos, true); }
    isLoading = false;
}

function renderOnlinePhotos(photos, append = false) {
    const grid = document.getElementById('photosGrid');
    const html = photos.map(photo => `
        <div class="pin" onclick="window.open('${photo.src.large2x || photo.src.large}', '_blank')">
            <img src="${photo.src.medium}" alt="" loading="lazy" onload="this.style.opacity=1" style="opacity:0;transition:opacity 0.3s">
            <div class="pin-actions">
                <button onclick="event.stopPropagation(); saveOnlinePhoto('${photo.src.medium}', '${(photo.alt || 'Photo').replace(/'/g, '')}', '${photo.photographer.replace(/'/g, '')}')">💾</button>
            </div>
            <div class="pin-info">
                <h4>${(photo.alt || 'Photo').substring(0, 30)}</h4>
                <small>@${photo.photographer}</small>
            </div>
        </div>
    `).join('');
    
    if (append) grid.innerHTML += html;
    else grid.innerHTML = html;
}

function saveOnlinePhoto(url, title, author) {
    if (!AxsuzStorage.getUser()) { alert('Please login first!'); window.location.href = 'login.html'; return; }
    AxsuzStorage.addPin(title, 'Saved from online • by ' + author, url);
    alert('✅ Saved to offline pins!');
}

// ===== OFFLINE (localStorage) =====
function loadOfflinePins() {
    showSkeleton(6);
    
    setTimeout(() => {
        const pins = AxsuzStorage.getPins();
        
        if (pins.length === 0) {
            document.getElementById('photosGrid').innerHTML = `
                <div class="empty-state">
                    <div class="icon">📱</div>
                    <p>𝐍𝐨 𝐨𝐟𝐟𝐥𝐢𝐧𝐞 𝐩𝐢𝐧𝐬 𝐲𝐞𝐭<br>
                    <a href="upload.html" style="color:#ff0055;">Upload your first pin!</a></p>
                </div>
            `;
            return;
        }
        
        renderOfflinePins(pins);
    }, 300);
}

function renderOfflinePins(pins) {
    const grid = document.getElementById('photosGrid');
    const user = AxsuzStorage.getUser();
    grid.innerHTML = pins.map(pin => `
        <div class="pin" onclick="window.open('${pin.image}', '_blank')">
            <img src="${pin.image}" alt="" loading="lazy" onerror="this.src='images/logo.jpg'" onload="this.style.opacity=1" style="opacity:0;transition:opacity 0.3s">
            <div class="pin-actions">
                <button onclick="event.stopPropagation(); likePin(${pin.id})">
                    ${pin.likedBy && user && pin.likedBy.includes(user.id) ? '❤️' : '🤍'} ${pin.likes || 0}
                </button>
                <button onclick="event.stopPropagation(); savePin(${pin.id})">💾</button>
                ${user && pin.userId === user.id ? `<button onclick="event.stopPropagation(); deletePin(${pin.id})" style="color:#ff4444;border-color:#ff4444;">🗑️</button>` : ''}
            </div>
            <div class="pin-info">
                <h4>${pin.title}</h4>
                <small>@${pin.username}</small>
            </div>
        </div>
    `).join('');
}

function likePin(id) {
    if (!AxsuzStorage.getUser()) { alert('Please login first!'); window.location.href = 'login.html'; return; }
    AxsuzStorage.toggleLike(id);
    switchMode('offline');
}

function savePin(id) {
    if (!AxsuzStorage.getUser()) { alert('Please login first!'); window.location.href = 'login.html'; return; }
    AxsuzStorage.toggleSave(id);
    alert('Saved!');
}

function deletePin(id) {
    if (confirm('Delete this pin?')) {
        AxsuzStorage.deletePin(id);
        switchMode('offline');
    }
}

// ===== INFINITE SCROLL =====
function setupInfiniteScroll() {
    const trigger = document.getElementById('loadMoreTrigger');
    if (!trigger) return;
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: '200px' });
    observer.observe(trigger);
}
</script>

</body>
</html>
